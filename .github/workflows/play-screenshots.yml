name: ArkGram Play screenshots

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Optional successful release run whose signed Play bundle should be verified
        type: string
        default: ''
      ui_apk_run_id:
        description: Optional successful UI build run whose emulator APK should be reused
        type: string
        default: ''
      verify_reviewer_login:
        description: Verify real Android reviewer sign-in and log out the temporary device
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.1.0
        if: inputs.release_run_id == '' && inputs.ui_apk_run_id == ''
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: android-actions/setup-android@v4.0.1
        if: inputs.release_run_id == '' && inputs.ui_apk_run_id == ''
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Build release UI for the x86_64 emulator
        if: inputs.release_run_id == '' && inputs.ui_apk_run_id == ''
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
          release_alias="$(keytool -list -keystore TMessagesProj/config/release.keystore -storepass "$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')"
          export ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS="$release_alias"
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease -PCI_ABI_FILTERS=x86_64 --build-cache --configuration-cache --stacktrace
          cp TMessagesProj_App/build/outputs/apk/afat/release/*.apk universal.apk
          ./gradlew --stop
      - name: Download the CI emulator APK
        if: inputs.ui_apk_run_id != ''
        uses: actions/download-artifact@v8.0.2
        with:
          name: ArkGram-Play-UI-apk
          path: .
          run-id: ${{ inputs.ui_apk_run_id }}
          github-token: ${{ github.token }}
      - name: Preserve emulator APK for UI-only reruns
        if: inputs.release_run_id == '' && inputs.ui_apk_run_id == ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ArkGram-Play-UI-apk
          path: universal.apk
          if-no-files-found: error
      - name: Download the signed Play bundle
        if: inputs.release_run_id != ''
        uses: actions/download-artifact@v8.0.2
        with:
          name: TMessagesProj_App-bundleAfat-release.aab
          path: play-bundle
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Generate the emulator APK from the Play bundle
        if: inputs.release_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.18.3 -R google/bundletool --pattern bundletool-all-1.18.3.jar
          release_alias="$(keytool -list -keystore TMessagesProj/config/release.keystore -storepass "$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')"
          java -jar bundletool-all-1.18.3.jar build-apks --bundle=play-bundle/TMessagesProj_App-bundleAfat-release.aab --output=play.apks --mode=universal --ks=TMessagesProj/config/release.keystore --ks-key-alias="$release_alias" --ks-pass="pass:$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD" --key-pass="pass:$ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD"
          unzip -p play.apks universal.apk > universal.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual offline demo screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REVIEW_LOGIN_CODE: ${{ inputs.verify_reviewer_login && secrets.ARKGRAM_REVIEW_LOGIN_CODE || '' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -g universal.apk
            if [ "${{ inputs.verify_reviewer_login }}" = "true" ]; then test -n "$REVIEW_LOGIN_CODE"; python3 Tools/ci/verify_reviewer_login.py; fi
            python3 Tools/ci/capture_review_demo.py
      - name: Report emulator host diagnostics
        if: always()
        run: |
          free -h
          df -h /
          ps -eo comm,rss --sort=-rss | head -n 12
          sudo dmesg --ctime | tail -n 80
      - name: Upload screenshots and UI hierarchy
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ArkGram-Play-screenshots
          path: play-screenshots/
          if-no-files-found: error
