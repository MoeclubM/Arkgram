name: ArkGram review login service

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Optional deployed HTTPS service base URL, including trailing slash
        type: string
        default: ''
      verify_authorization:
        description: Verify a real account login and log out the temporary CI session
        type: boolean
        default: false
  push:
    paths:
      - 'Tools/review-login/**'
      - '.github/workflows/review-login.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build the pure Python dependency wheel in CI
        run: python -m pip wheel --no-deps --wheel-dir pure-wheels pyaes==1.6.1
      - name: Install service dependencies
        run: 'python -m pip install --find-links=pure-wheels --only-binary=:all: -r Tools/review-login/requirements.txt'
      - name: Verify service authentication and real unauthorized MTProto connection
        run: python -m unittest discover -s Tools/review-login/tests -v
      - name: Check browser script syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          for page in Path('Tools/review-login').glob('*.html'):
              script = re.search(r'<script>(.*?)</script>', page.read_text(encoding='utf-8'), re.S).group(1)
              subprocess.run(['node', '--check'], input=script, text=True, check=True)
              print(f'{page.name}: script syntax valid')
          PY
      - name: Verify the deployed HTTPS service
        if: inputs.deployment_url != ''
        env:
          REVIEW_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen
          base = os.environ['REVIEW_DEPLOYMENT_URL']
          with urlopen(base + 'healthz', timeout=30) as response:
              assert response.status == 200
              assert json.load(response)['telegram_connected'] is True
          for path in ['admin/', 'api/status']:
              try:
                  urlopen(base + path, timeout=30)
              except HTTPError as error:
                  assert error.code == 401, (path, error.code)
                  assert 'Basic' in error.headers['WWW-Authenticate']
              else:
                  raise AssertionError(f'{path} did not require credentials')
          print('HTTPS health and protected owner/reviewer endpoints verified.')
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ArkGram-review-login-pure-wheels
          path: pure-wheels/
          if-no-files-found: error
      - name: Verify real account device authorization
        if: inputs.verify_authorization
        env:
          REVIEW_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          REVIEW_ACCESS_CODE: ${{ secrets.ARKGRAM_REVIEW_ACCESS_CODE }}
        run: python Tools/review-login/verify_authorization.py
