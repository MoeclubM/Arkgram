server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oracle-osa-01.telecom.moe;
    ssl_certificate /www/sites/secapi.telecom.moe/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/secapi.telecom.moe/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    include /www/sites/secapi.telecom.moe/proxy/arkgram-review.conf;
    location / { return 404; }
}
