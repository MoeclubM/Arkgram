name: ArkGram CodeQL

run-name: ArkGram CodeQL · ${{ github.head_ref || github.ref_name }} · @${{ github.actor }} · #${{ github.run_number }}

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ORG_GRADLE_PROJECT_CI_ABI_FILTERS: arm64-v8a
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.36.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Java
        if: ${{ matrix.build-mode == 'manual' }}
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: ${{ matrix.build-mode == 'manual' }}
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-disabled: true

      - name: Set up Android SDK
        if: ${{ matrix.build-mode == 'manual' }}
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Prepare local.properties
        if: ${{ matrix.build-mode == 'manual' }}
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties

      - name: Compile Java and Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:compileAfatDebugJavaWithJavac \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --max-workers=2 --no-build-cache --no-configuration-cache --stacktrace

      - name: Compile native code for CodeQL
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:externalNativeBuildDebug \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=1g" \
            --max-workers=2 --no-build-cache --no-configuration-cache --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.36.0
        with:
          category: /language:${{ matrix.language }}
          threads: 2
          ram: 6144
