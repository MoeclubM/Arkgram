name: ArkGram Release Builds

run-name: ArkGram Release Builds · ${{ github.ref_name }} · @${{ github.actor }} · #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_CI_ABI_FILTERS: armeabi-v7a,arm64-v8a,x86,x86_64
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-cleanup: always
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Prepare local.properties
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties

      - name: Compute CI version
        shell: bash
        run: |
          version_name="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          fi
          echo "ORG_GRADLE_PROJECT_APP_VERSION_CODE=$(($(date -u +%s) / 60))" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_APP_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"

      - name: Validate signing inputs
        shell: bash
        run: |
          test -n "${ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD}"
          test -n "${ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD}"
          test -n "${ORG_GRADLE_PROJECT_APP_VERSION_CODE}"
          test -f TMessagesProj/config/release.keystore

      - name: Resolve release key alias
        shell: bash
        run: |
          release_alias="$(keytool -list -keystore TMessagesProj/config/release.keystore -storepass "${ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD}" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')"
          test -n "${release_alias}"
          echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=${release_alias}" >> "$GITHUB_ENV"

      - name: Build release APKs and AABs
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew \
            :TMessagesProj_App:assembleBundleAfatRelease \
            :TMessagesProj_App:bundleBundleAfatRelease \
            :TMessagesProj_AppStandalone:assembleAfatStandalone \
            :TMessagesProj_AppStandalone:bundleAfatStandalone \
            -PAPP_VERSION_CODE="$ORG_GRADLE_PROJECT_APP_VERSION_CODE" \
            -PAPP_VERSION_NAME="$ORG_GRADLE_PROJECT_APP_VERSION_NAME" \
            --build-cache --configuration-cache --stacktrace

      - name: Check native library page sizes
        shell: bash
        run: |
          python Tools/ci/check_native_pages.py \
            TMessagesProj_App/build/outputs/apk/bundleAfat/release/*.apk \
            TMessagesProj_App/build/outputs/bundle/bundleAfatRelease/*.aab \
            TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/*.apk \
            TMessagesProj_AppStandalone/build/outputs/bundle/afatStandalone/*.aab

      - name: Name release assets
        shell: bash
        run: |
          mkdir -p release
          cp TMessagesProj_App/build/outputs/apk/bundleAfat/release/*.apk "release/ArkGram-${ORG_GRADLE_PROJECT_APP_VERSION_NAME}-store.apk"
          cp TMessagesProj_App/build/outputs/bundle/bundleAfatRelease/*.aab "release/ArkGram-${ORG_GRADLE_PROJECT_APP_VERSION_NAME}-store.aab"
          cp TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/*.apk "release/ArkGram-${ORG_GRADLE_PROJECT_APP_VERSION_NAME}-web.apk"
          cp TMessagesProj_AppStandalone/build/outputs/bundle/afatStandalone/*.aab "release/ArkGram-${ORG_GRADLE_PROJECT_APP_VERSION_NAME}-web.aab"

      - name: Upload release builds
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ArkGram-${{ env.ORG_GRADLE_PROJECT_APP_VERSION_NAME }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release binaries
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ArkGram ${{ env.ORG_GRADLE_PROJECT_APP_VERSION_NAME }}
          fail_on_unmatched_files: true
          files: release/*
          body: |
            基于 Telegram Android 13.1.1 (7237)。ArkGram 是非官方 Telegram 客户端。

            - **store.apk / store.aab**：商店版本，包名 `moe.telecom.arkgram`，与 Google Play 版本对应。
            - **web.apk / web.aab**：独立分发版本，包名 `moe.telecom.arkgram.web`，与官方 Web standalone 构建对应；这里的 Web 指官网下载渠道，仍为 Android 应用。
            - APK 可直接安装；AAB 用于应用商店分发。两种版本均包含 ARMv7、ARM64、x86、x86_64。

            保留 ArkGram 的多账号、翻译、自定义 AI、广告过滤、底栏和品牌调整；收敛与上游无关的源码及构建改动，恢复上游支付和指纹接口。

            [Google Play](https://play.google.com/store/apps/details?id=moe.telecom.arkgram) · [隐私政策](https://www.telecom.moe/arkgram/privacy/)
