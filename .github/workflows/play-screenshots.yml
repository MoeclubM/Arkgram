name: ArkGram Play screenshots

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Build release UI for the x86_64 emulator
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
          release_alias="$(keytool -list -keystore TMessagesProj/config/release.keystore -storepass "$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')"
          export ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS="$release_alias"
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease -PCI_ABI_FILTERS=x86_64 --build-cache --configuration-cache --stacktrace
          cp TMessagesProj_App/build/outputs/apk/afat/release/*.apk universal.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual offline demo screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -g universal.apk
            python3 Tools/ci/capture_review_demo.py
      - name: Upload screenshots and UI hierarchy
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ArkGram-Play-screenshots
          path: play-screenshots/
          if-no-files-found: error
