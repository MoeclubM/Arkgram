name: ArkGram Play screenshots

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful release workflow run containing the Play AAB
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Play release bundle without unpacking the AAB
        uses: actions/download-artifact@v8
        with:
          name: TMessagesProj_App-bundleAfat-release.aab
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: bundle
          skip-decompress: true
      - name: Prepare emulator APK with a temporary debug key
        run: |
          gh release download --repo google/bundletool --pattern 'bundletool-all-*.jar' --dir bundletool
          keytool -genkeypair -keystore screenshot.jks -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 365
          bundle_path=(bundle/*.aab)
          java -jar bundletool/bundletool-all-*.jar build-apks --bundle="${bundle_path[0]}" --output=app.apks --mode=universal --ks=screenshot.jks --ks-pass=pass:android --key-pass=pass:android --ks-key-alias=androiddebugkey
          unzip -j app.apks universal.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual offline demo screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -g universal.apk
            python3 Tools/ci/capture_review_demo.py
      - name: Upload screenshots and UI hierarchy
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ArkGram-Play-screenshots
          path: play-screenshots/
          if-no-files-found: error
