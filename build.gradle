import groovy.xml.XmlSlurper

buildscript {
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'io.netty' && details.requested.name.startsWith('netty-')) {
                details.useVersion '4.2.15.Final'
            } else if (details.requested.group == 'org.bouncycastle' && details.requested.name.endsWith('-jdk18on')) {
                details.useVersion '1.84'
            } else if (details.requested.group == 'org.bitbucket.b_c' && details.requested.name == 'jose4j') {
                details.useVersion '0.9.6'
            } else if (details.requested.group == 'org.jdom' && details.requested.name == 'jdom2') {
                details.useVersion '2.0.6.1'
            } else if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
                details.useVersion '3.20.0'
            } else if (details.requested.group == 'org.apache.httpcomponents' && details.requested.name == 'httpclient') {
                details.useVersion '4.5.14'
            }
        }
    }
}

plugins {
    id 'com.android.application' apply false
    id 'com.android.library' apply false
    id 'org.jetbrains.kotlin.android' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
}

subprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'io.netty' && details.requested.name.startsWith('netty-')) {
                details.useVersion '4.2.15.Final'
            } else if (details.requested.group == 'org.bouncycastle' && details.requested.name.endsWith('-jdk18on')) {
                details.useVersion '1.84'
            } else if (details.requested.group == 'org.bitbucket.b_c' && details.requested.name == 'jose4j') {
                details.useVersion '0.9.6'
            } else if (details.requested.group == 'org.jdom' && details.requested.name == 'jdom2') {
                details.useVersion '2.0.6.1'
            } else if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
                details.useVersion '3.20.0'
            } else if (details.requested.group == 'org.apache.httpcomponents' && details.requested.name == 'httpclient') {
                details.useVersion '4.5.14'
            }
        }
    }
}

subprojects {
    plugins.withId("com.android.library") {
        android {
            buildTypes {
                beta {
                    initWith release
                }
            }
        }
    }

    plugins.withId("com.android.application") {
        android {
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}
